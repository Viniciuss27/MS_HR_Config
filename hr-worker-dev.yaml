spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_hr_worker
    username: postgres
    password: 1234567

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        hbm2ddl:
          delimiter: ;

      javax:
        persistence:
          schema-generation:
            create-source: metadata
            scripts:
              action: create
              create-target: create.sql
              
