spring:
  application:
    name: payroll
    
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_PAYROLL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

server:
  port: ${port:0}  

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: ${EUREKA_URI}

resilience4j:
  circuitbreaker:
    instances:
      worker:
        sliding-window-size: 10
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s

feign:
  client:
    config:
      default:
        decode404: true
